name: Android Build Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: "my-notes-app"

jobs:
  build-android:
    name: Build Android App (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare Keystore (If Available)
        working-directory: ./android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "Warning: KEYSTORE_BASE64 secret is not set! Falling back to debug build."
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: Determine Version Name
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "APP_VERSION=manual-${GITHUB_REF_NAME}" >> $GITHUB_ENV
          else
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          fi

      - name: Build Android App
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew assembleRelease bundleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Organize Artifacts
        run: |
          mkdir -p final-artifacts
          
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk final-artifacts/${APP_NAME}_${APP_VERSION}_android_release.apk
            cp android/app/build/outputs/bundle/release/app-release.aab final-artifacts/${APP_NAME}_${APP_VERSION}_android_release.aab
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk final-artifacts/${APP_NAME}_${APP_VERSION}_android_debug.apk
          fi

      - name: Upload Artifacts to Workflow
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: final-artifacts/*
          retention-days: 7

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: final-artifacts/*
