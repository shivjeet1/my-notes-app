name: Android Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Sync Capacitor Android
        run: npx cap sync android

      # Kotlin compiler version to match the 2.1.0 stdlib
      - name: Patch Kotlin Version for Capacitor
        run: |
          sed -i "s/kotlin_version = '[0-9.]*'/kotlin_version = '2.1.0'/g" android/variables.gradle

      - name: Build Release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          APP_NAME="my-notes-app"
          
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="manual-${GITHUB_REF_NAME}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          cd android/app/build/outputs/apk/debug/
          mv *.apk "${APP_NAME}_${VERSION}_android_release.apk"

      - name: Upload APK as Workflow Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: manual-build-apk
          path: android/app/build/outputs/apk/debug/*_android_release.apk
          retention-days: 7

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: |
            android/app/build/outputs/apk/debug/my-notes-app_*_android_release.apk
